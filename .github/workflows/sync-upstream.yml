name: Sync Upstream

on:
  schedule:
    # 每天 UTC 02:00 自动检查上游更新（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        run: |
          git config user.name "sync-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/v2rayA/v2rayA.git || true
          git fetch upstream --tags --force --quiet

          LOCAL=$(git rev-parse main)
          UPSTREAM=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "✅ 已是最新，无需同步"
            echo "synced=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 记录 rebase 前的 commit，用于恢复我们自己的 CI workflows
          BEFORE_REBASE=$(git rev-parse main)

          git rebase upstream/main

          # 恢复我们自己的 CI workflows（上游的 workflow 文件不适合 fork）
          git checkout $BEFORE_REBASE -- .github/workflows/
          # 删除上游新增但我们不需要的工作流文件（rebase 可能引入）
          rm -f .github/workflows/_build_windows_installer.yml
          # 如果有其他不需要的上游工作流，在这里也删除
          git add .github/workflows/
          git diff --cached --quiet || git commit -m "chore: keep our CI workflows"

          git push origin main --force-with-lease
          echo "🎉 已同步上游更新"
          echo "synced=true" >> $GITHUB_OUTPUT

      # 有更新时才触发 Docker 构建
      - name: 触发 Docker 构建
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Build and Push Docker Image" --ref main --repo workroom2008/v2raya-hb
