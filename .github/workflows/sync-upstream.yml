name: Sync Upstream

on:
  schedule:
    # 每天 UTC 02:00 自动检查上游更新（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git config user.name "sync-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/v2rayA/v2rayA.git || true
          git fetch upstream --tags --force --quiet

          LOCAL=$(git rev-parse main)
          UPSTREAM=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "✅ 已是最新，无需同步"
            exit 0
          fi

          git rebase upstream/main
          git push origin main --force-with-lease
          echo "🎉 已同步上游更新"

      # 同步后触发 Docker 构建，确保镜像版本与代码一致
      - name: 触发 Docker 构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Build and Push Docker Image" --ref main
